name: kalshi-rain-watcher

# One polling pass per run. Tier 4 (cycle-over-cycle diff) and the dedup/
# journal all work across runs because we commit the state files back, so each
# run loads the previous run's snapshot. "Previous cycle" = last run.
#
# Cadence: GitHub's own cron is best-effort and often delivers */5 schedules
# hours apart, so it's only the fallback. The real 5-minute clock is an
# external scheduler (e.g. cron-job.org) POSTing to the workflow_dispatch API:
#   POST /repos/tbnmichaud-sys/kalshi-scanner/actions/workflows/watcher.yml/dispatches
#   Authorization: Bearer <fine-grained PAT with Actions read+write>
#   body: {"ref":"main"}
on:
  schedule:
    - cron: '*/5 * * * *'     # fallback; GitHub delivers this sporadically
  workflow_dispatch: {}       # external cron + manual "Run workflow" button

permissions:
  contents: write             # needed to commit state files back

concurrency:                  # never overlap runs (a slow run blocks the next)
  group: watcher
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: One polling pass
        env:
          # set in repo Settings -> Secrets and variables -> Actions
          KALSHI_NOTIFY_WEBHOOK: ${{ secrets.KALSHI_NOTIFY_WEBHOOK }}
        run: python3 watcher.py --once   # ubuntu-latest ships python3 + tzdata

      - name: Settle journal + refresh P&L report
        run: python3 settle.py           # fills result/pnl once Kalshi reports

      - name: Persist state (journal, dedup, prev snapshot, P&L)
        run: |
          git config user.name  "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add trades.csv watcher_state.json watcher_prev.json PNL.md || true
          git commit -m "watcher state $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git pull --rebase -q || true
          git push
